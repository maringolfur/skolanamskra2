<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skólanámskrá Vallaskóla</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-[#fcfbf9] via-[#fcfbf9] via-70% to-sky-100/80 min-h-screen text-slate-800 font-sans p-4 md:p-8">

  <!-- ==================== FORSÍÐA (YFIRFLOKKAR) ==================== -->
  <div id="homeView" class="max-w-4xl mx-auto pt-8 pb-16 space-y-10">
    <header class="text-center space-y-4">
      <div class="flex justify-center mb-2">
        <img src="images/logo.jpg" alt="Vallaskóli Lógó" class="h-32 md:h-40 object-contain" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='inline-flex';">
        <div id="fallbackLogo" class="hidden items-center justify-center w-28 h-28 rounded-2xl bg-sky-700 text-white font-extrabold text-4xl shadow-md">
          V
        </div>
      </div>
      <div class="space-y-2">
        <p class="text-xs md:text-sm font-semibold tracking-wider text-sky-800 uppercase italic">
          Virðing &bull; Þekking &bull; Lífsgleði
        </p>
        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight">
          Skólanámskrá Vallaskóla
        </h1>
        <p class="text-sm md:text-base text-slate-500 max-w-md mx-auto pt-1">
          Veldu flokk til að skoða námskrána, árganga eða faggreinar.
        </p>
      </div>
    </header>

    <main class="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-4xl mx-auto">
      <!-- FLÍS 1: ALMENNUR HLUTI -->
      <button onclick="showDetail('almennt', 'home')" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-emerald-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-emerald-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          🏫
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-emerald-700">Almennur hluti</h2>
          <p class="text-xs text-slate-500 mt-1.5">Stefna skólans, gildi og almennt um skólastarfið</p>
        </div>
      </button>

      <!-- FLÍS 2: ÁRGANGAR -->
      <button onclick="showYears()" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-sky-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-sky-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          🎓
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-sky-700">Árgangar</h2>
          <p class="text-xs text-slate-500 mt-1.5">Skoða námskrá og kennsluáætlanir eftir 1. – 10. bekk, ÍSAT og stoðþjónustu</p>
        </div>
      </button>

      <!-- FLÍS 3: FAGGREINAR -->
      <button onclick="showSubjects()" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-amber-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-amber-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          📚
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-amber-700">Faggreinar</h2>
          <p class="text-xs text-slate-500 mt-1.5">Skoða námskrá eftir námsgreinum og fagsviðum</p>
        </div>
      </button>
    </main>
  </div>

  <!-- ==================== ÁRGANGASÍÐA ==================== -->
  <div id="yearsView" class="max-w-5xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-8">
      <button onclick="showHome()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">
        ← Til baka á forsíðu
      </button>
      <h2 class="text-xl font-extrabold text-slate-900">🎓 Árgangar</h2>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5" id="yearsGrid"></div>
  </div>

  <!-- ==================== FAGGREINASÍÐA ==================== -->
  <div id="subjectsView" class="max-w-5xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-8">
      <button onclick="showHome()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">
        ← Til baka á forsíðu
      </button>
      <h2 class="text-xl font-extrabold text-slate-900">📚 Faggreinar</h2>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5" id="subjectsGrid"></div>
  </div>

  <!-- ==================== BAKSÍÐA / UPPLÝSINGASÍÐA ==================== -->
  <div id="detailView" class="max-w-4xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-6">
      <button id="backNavBtn" onclick="goBackFromDetail()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">
        ← Til baka
      </button>
      <button onclick="showHome()" class="text-xs text-sky-800 font-semibold hover:underline">
        Forsíða
      </button>
    </div>

    <div class="flex items-center gap-4 mb-8">
      <span id="detailIcon" class="text-5xl md:text-6xl"></span>
      <div>
        <h1 id="detailTitle" class="text-2xl md:text-4xl font-extrabold text-slate-900"></h1>
        <p class="text-xs md:text-sm text-sky-800 font-semibold uppercase tracking-wider pt-1">Vallaskóli &bull; Skólanámskrá</p>
      </div>
    </div>

    <div id="detailContent" class="space-y-6"></div>

    <div class="pt-10 border-t border-slate-200/80 mt-12 flex justify-between items-center">
      <button onclick="goBackFromDetail()" class="px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold transition shadow-md">
        ← Til baka
      </button>
      <a href="#" class="text-xs text-slate-500 hover:text-slate-800 font-medium">Efst á síðu ↑</a>
    </div>
  </div>

  <!-- ==================== POPUP GLUGGI FYRIR KENNARA ==================== -->
  <div id="teacherModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50" onclick="closeTeacherModalOnBg(event)">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center relative shadow-2xl border border-slate-100 space-y-4">
      <button onclick="closeTeacherModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 font-bold text-lg p-1 transition">✕</button>
      
      <img id="teacherModalImg" src="" alt="Mynd af starfsmanni" class="w-32 h-32 rounded-full object-cover mx-auto border-4 border-sky-100 shadow-md">
      
      <div class="space-y-1">
        <h3 id="teacherModalName" class="text-lg font-bold text-slate-900"></h3>
        <p id="teacherModalRole" class="text-xs text-slate-500 font-medium"></p>
      </div>

      <div class="pt-2">
        <a id="teacherModalEmail" href="" class="inline-flex items-center gap-2 px-4 py-2.5 bg-sky-50 hover:bg-sky-100 text-sky-800 rounded-xl text-xs font-semibold transition border border-sky-200/50">
          ✉️ <span id="teacherModalEmailText"></span>
        </a>
      </div>

      <button onclick="closeTeacherModal()" class="w-full pt-2 text-xs text-slate-400 hover:text-slate-600 underline">
        Loka glugga
      </button>
    </div>
  </div>

  <script>
    const YEARS_LIST = [
      { id: 'y1', title: '1. árgangur', icon: '🌱' },
      { id: 'y2', title: '2. árgangur', icon: '🍃' },
      { id: 'y3', title: '3. árgangur', icon: '🌿' },
      { id: 'y4', title: '4. árgangur', icon: '☘️' },
      { id: 'y5', title: '5. árgangur', icon: '🍀' },
      { id: 'y6', title: '6. árgangur', icon: '🌲' },
      { id: 'y7', title: '7. árgangur', icon: '🌳' },
      { id: 'y8', title: '8. árgangur', icon: '🎓' },
      { id: 'y9', title: '9. árgangur', icon: '🎓' },
      { id: 'y10', title: '10. árgangur', icon: '🎓' },
      { id: 'isat', title: 'ÍSAT', icon: '🌍' },
      { id: 'stod', title: 'Stoðkennsla', icon: '🤝' }
    ];

    const SUBJECTS_LIST = [
      { id: 's_isl', title: 'Íslenska', icon: '📖' },
      { id: 's_stf', title: 'Stærðfræði', icon: '📐' },
      { id: 's_nat', title: 'Náttúrufræði', icon: '🔬' },
      { id: 's_ens', title: 'Enska', icon: '🇬🇧' },
      { id: 's_sam', title: 'Samfélagsfræði', icon: '🗺️' },
      { id: 's_dan', title: 'Danska', icon: '🇩🇰' },
      { id: 's_ith', title: 'Skólaíþróttir', icon: '🏃' },
      { id: 's_lver', title: 'List- og verkgreinar', icon: '🎨' },
      { id: 'isat', title: 'ÍSAT', icon: '🌍' },
      { id: 'stod', title: 'Stoðkennsla', icon: '🤝' }
    ];

    // INNGANGSTEXTAR FYRIR FAGGREINAR
    const SUBJECT_INTROS = {
      's_stf': `
        <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-4 mb-6">
          <h3 class="font-bold text-sky-900 text-lg border-b pb-2">📐 Um stærðfræðikennslu</h3>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
            Stærðfræði hefur frá því sögur hófust verið mikilvægur hluti menningarinnar þar sem verkefni hennar er að finna, skapa, tjá og útskýra hvers kyns regluleika, lögmál, kerfi og mynstur. Hún er mikilvæg leið til að ígrunda, skapa merkingu og skilja náttúru, samfélag, efnahag, vísindi, tækni og stafræna þróun.
          </p>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
            Með þekkingu á stærðfræði getur nemandi náð betri stjórn á aðstæðum, aukið getu sína til aðgerða, átt í samskiptum, skipulagt, dregið ályktanir og tekið skynsamlegri og gagnrýnni ákvarðanir og borið ábyrgð í daglegu lífi, m.a. á eigin lífsháttum, fjármálum og neyslu.
          </p>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
            Megintilgangur náms og kennslu í stærðfræði er að nemendur öðlist alhliða hæfni og skilning til að nota stærðfræði sem verkfæri í fjölbreyttum og margs konar tilgangi og við ólíkar aðstæður í daglegu lífi, leik og starfi. Nemendur þurfa að fá tækifæri til að þróa með sér hæfni til að setja fram lausnir og leysa viðfangsefni, ígrunda ólíkar aðferðir og líkön sem nýtast við lausn viðfangsefna og leggja mat á niðurstöður.
          </p>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
            Við skipulagningu náms og kennslu í stærðfræði skal unnið með öll hæfniviðmið á skólagöngu nemenda. Stuðla þarf að því að nemendur öðlist þá hæfni sem til er ætlast en hæfni felur í sér yfirsýn og getu til að hagnýta þekkingu og leikni sem aflað hefur verið.
          </p>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
            Hæfniviðmiðum í stærðfræði sem og öðrum námsgreinum er skipt í nokkra flokka. Flokkarnir eru ekki einangraðir innan námsgreinar eða námssviðs heldur hlutar af samofinni heild þar sem hver flokkur getur haft gagn af hinum, innan og á milli námsgreina og námssviða, sem gefur tækifæri til heildstæðrar verkefnavinnu og samþættingar.
          </p>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed font-medium text-slate-700">
            Nám í stærðfræði þarf að eiga sér stað alla skólagönguna og miða að því að nemendur þrói með sér jákvætt viðhorf til stærðfræðilegra viðfangsefna og því sé viðhaldið, átti sig á notagildi hennar og öðlist trú á eigin getu. Mikilvægt er að nemendur séu meðvitaðir um að mistök skapa tækifæri til að læra af þeim, þeir þurfa að greina hvað fór úrskeiðis og styrkja þannig skilning sinn á stærðfræði.
          </p>
        </div>
      `,
      's_dan': `
        <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-4 mb-6">
          <h3 class="font-bold text-sky-900 text-lg border-b pb-2">🇩🇰 Um dönskukennslu og Norðurlandamál</h3>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
            Annað erlenda tungumálið sem nemendur læra í grunnskóla er danska eða annað Norðurlandamál. Gert er ráð fyrir að danska sé alla jafna það norræna tungumál sem kennt er í skólum hér á landi en kennsla í norsku eða sænsku stendur til boða nemendum sem hafa sérstök tengsl við Noreg eða Svíþjóð. Kennslan kemur í staðinn fyrir dönskukennslu og hefst á sama tíma og dönskukennsla hefst í grunnskólanum.
          </p>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
            Nemendur, sem hafa rétt á að velja norsku eða sænsku, þurfa að búa yfir undirstöðukunnáttu í málunum. Þeir hafa því kynnst samfélaginu, þekkja tjáskiptareglur þeirra og siði. Sumir þessara nemenda hafa málfarslegar og menningarlegar rætur bæði á Íslandi og í Noregi eða Svíþjóð. Mikilvægt er að þessir nemendur fái hvatningu til að viðhalda og styrkja tengsl við land og þjóð. Undirstöðukunnátta, sem nemandi þarf að hafa til að geta stundað nám í norsku eða sænsku, er að skilja allvel talaða norsku eða sænsku, geta lesið og skilið einfalda norska eða sænska texta miðað við sinn aldurshóp og geta gert sig skiljanlegan á töluðu norsku eða sænsku máli. Þessi lágmarkskunnátta er nauðsynleg til þess að nemendur geti nýtt sér það norskunám eða sænskunám sem í boði er.
          </p>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
            Norðurlandamál eru kennd vegna viðvarandi samskipta og menningartengsla við norrænar þjóðir. Saga okkar er samofin sögu þeirra, menningu og menningararfi og tungumálin sprottin af sömu rót. Þau eru skilgreind nánar í gildandi norrænu tungumálayfirlýsingunni.
          </p>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
            Tilgangur náms og kennslu í norrænum tungumálum á Íslandi er að viðhalda og styrkja tengsl við Norðurlandaþjóðirnar og stuðla að því að Íslendingar eigi greiða leið að sameiginlegum markaði menntunar og atvinnu á Norðurlöndunum. Hæfni og kunnátta í norrænum tungumálum gerir Íslendingum kleift að vera virkir þátttakendur í mikilvægu norrænu samstarfi, námi, starfi og leik.
          </p>
          <p class="text-xs md:text-sm text-slate-600 leading-relaxed font-medium text-slate-700">
            Góð kunnátta í einu norrænu tungumáli er lykill að hvaða svæði sem er á Norðurlöndunum og greiðir fyrir öllum samskiptum.
          </p>
        </div>
      `
    };

    // HJÁLPARFALL TIL AÐ BÚA TIL KENNARAHNAPPA
    function createTeacherCard(name, role, email, imgName) {
      return `
        <button onclick="openTeacherModal('${name}', '${role}', '${email}', 'images/${imgName}')" class="flex items-center gap-3 p-3 bg-slate-50 hover:bg-sky-50/70 hover:border-sky-300 rounded-2xl border border-slate-100 transition duration-200 text-left group shadow-sm w-full">
          <img src="images/${imgName}" alt="${name}" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm group-hover:scale-105 transition flex-shrink-0" onerror="this.src='https://via.placeholder.com/150?text=${encodeURIComponent(name.split(' ')[0])}';">
          <div class="overflow-hidden">
            <h5 class="font-bold text-xs md:text-sm text-slate-900 group-hover:text-sky-700 transition truncate">${name}</h5>
            <p class="text-xs text-slate-500 truncate">${role}</p>
          </div>
        </button>
      `;
    }

    // STJÓRNENDUR YNGRI DEILDAR (1.-6. ÁRGANGUR)
    const MANAGERS_YNGRI = `
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
        ${createTeacherCard('Páll Sveinsson', 'Skólastjóri', 'pall@vallaskoli.is', 'pall.jpg')}
        ${createTeacherCard('Þorvaldur Halldór Gunnarsson', 'Aðstoðarskólastjóri', 'thorvaldur@vallaskoli.is', 'thorvaldur.jpg')}
        ${createTeacherCard('Steinunn Húbertína Eggertsdóttir', 'Deildarstjóri yngri deild', 'steinunn@vallaskoli.is', 'steinunn.jpg')}
        ${createTeacherCard('Hólmfríður Sigrún Gylfadóttir', 'Verkefnisstjóri yngri deild', 'holmfridur@vallaskoli.is', 'holmfridur.jpg')}
      </div>
    `;

    // STJÓRNENDUR ELDRI DEILDAR (7.-10. ÁRGANGUR)
    const MANAGERS_ELDRI = `
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
        ${createTeacherCard('Páll Sveinsson', 'Skólastjóri', 'pall@vallaskoli.is', 'pall.jpg')}
        ${createTeacherCard('Þorvaldur Halldór Gunnarsson', 'Aðstoðarskólastjóri', 'thorvaldur@vallaskoli.is', 'thorvaldur.jpg')}
        ${createTeacherCard('Guðmundur Sigmarsson', 'Deildarstjóri eldri deild', 'gudmundurs@vallaskoli.is', 'gudmundurs.jpg')}
        ${createTeacherCard('Már Ingólfur Másson', 'Verkefnisstjóri eldri deild', 'mar@vallaskoli.is', 'mar.jpg')}
      </div>
    `;

    // STOÐÞJÓNUSTA ELDRI DEILDAR (8.-10. ÁRGANGUR)
    const STODTHJONUSTA_ELDRI = `
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
        ${createTeacherCard('Bryndís Ósk Sævarsdóttir Woodward', 'Stoðþjónusta', 'bryndis@vallaskoli.is', 'bryndis.jpg')}
        ${createTeacherCard('Íris Árný Magnúsdóttir', 'Stoðþjónusta', 'irisarny@vallaskoli.is', 'iam.jpg')}
        ${createTeacherCard('Kristín Jónasdóttir', 'Stoðþjónusta', 'kristinj@vallaskoli.is', 'kristinj.jpg')}
        ${createTeacherCard('Tómas Smári Guðmundsson', 'Exið / Stoðþjónusta', 'tomas@vallaskoli.is', 'tomas.jpg')}
      </div>
    `;

    // STUÐNINGSFULLTRÚAR ELDRI DEILDAR (8.-10. ÁRGANGUR)
    const STUDNINGSFULLTRUAR_ELDRI = `
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
        ${createTeacherCard('Árni Ísleifsson', 'Stuðningsfulltrúi', 'arni@vallaskoli.is', 'arni.jpg')}
        ${createTeacherCard('Bryndís Sveinsdóttir', 'Stuðningsfulltrúi', 'bryndiss@vallaskoli.is', 'bryndiss.jpg')}
        ${createTeacherCard('Linda Björg Sigurðardóttir', 'Stuðningsfulltrúi', 'linda@vallaskoli.is', 'linda.jpg')}
        ${createTeacherCard('Pierre Roger Erikson', 'Stuðningsfulltrúi', 'pierre@vallaskoli.is', 'pierre.jpg')}
      </div>
    `;

    // AÐRIR KENNARAR & FAGTEYMI ELDRI DEILDAR (8.-10. ÁRGANGUR)
    const ADRIR_ELDRI = `
      <div class="space-y-4">
        <div>
          <h5 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">🎨 Verkgreinar, listgreinar og íþróttir</h5>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            ${createTeacherCard('Aleksandar Petrovic', 'Íþróttir og sund', 'aleksandar@vallaskoli.is', 'aleksandar.jpg')}
            ${createTeacherCard('Gylfi Birgir Sigurjónsson', 'Íþróttir og sund', 'gylfi@vallaskoli.is', 'gylfi.jpg')}
            ${createTeacherCard('Sigríður Baxter', 'Íþróttir og sund', 'sigridur@vallaskoli.is', 'sigridur.jpg')}
            ${createTeacherCard('Einar Ottó Antonsson', 'Íþróttir og sund', 'einar@vallaskoli.is', 'einar.jpg')}
