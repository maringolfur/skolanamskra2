<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skólanámskrá Vallaskóla</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-[#fcfbf9] via-[#fcfbf9] via-70% to-sky-100/80 min-h-screen text-slate-800 font-sans p-4 md:p-8">

  <!-- ==================== FORSÍÐA (YFIRFLOKKAR) ==================== -->
  <div id="homeView" class="max-w-4xl mx-auto pt-8 pb-16 space-y-10">
    <header class="text-center space-y-4">
      <div class="flex justify-center mb-2">
        <img src="images/logo.jpg" alt="Vallaskóli Lógó" class="h-32 md:h-40 object-contain" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='inline-flex';">
        <div id="fallbackLogo" class="hidden items-center justify-center w-28 h-28 rounded-2xl bg-sky-700 text-white font-extrabold text-4xl shadow-md">
          V
        </div>
      </div>
      <div class="space-y-2">
        <p class="text-xs md:text-sm font-semibold tracking-wider text-sky-800 uppercase italic">
          Virðing &bull; Þekking &bull; Lífsgleði
        </p>
        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight">
          Skólanámskrá Vallaskóla
        </h1>
        <p class="text-sm md:text-base text-slate-500 max-w-md mx-auto pt-1">
          Veldu flokk til að skoða námskrána, árganga eða faggreinar.
        </p>
      </div>
    </header>

    <main class="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-4xl mx-auto">
      <!-- FLÍS 1: ALMENNUR HLUTI -->
      <button onclick="showDetail('almennt', 'home')" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-emerald-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-emerald-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          🏫
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-emerald-700">Almennur hluti</h2>
          <p class="text-xs text-slate-500 mt-1.5">Stefna skólans, gildi og almennt um skólastarfið</p>
        </div>
      </button>

      <!-- FLÍS 2: ÁRGANGAR -->
      <button onclick="showYears()" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-sky-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-sky-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          🎓
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-sky-700">Árgangar</h2>
          <p class="text-xs text-slate-500 mt-1.5">Skoða námskrá og kennsluáætlanir eftir 1. – 10. bekk, ÍSAT og stoðþjónustu</p>
        </div>
      </button>

      <!-- FLÍS 3: FAGGREINAR -->
      <button onclick="showSubjects()" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-amber-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-amber-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          📚
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-amber-700">Faggreinar</h2>
          <p class="text-xs text-slate-500 mt-1.5">Skoða námskrá eftir námsgreinum og fagsviðum</p>
        </div>
      </button>
    </main>
  </div>

  <!-- ==================== ÁRGANGASÍÐA ==================== -->
  <div id="yearsView" class="max-w-5xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-8">
      <button onclick="showHome()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">
        ← Til baka á forsíðu
      </button>
      <h2 class="text-xl font-extrabold text-slate-900">🎓 Árgangar</h2>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5" id="yearsGrid"></div>
  </div>

  <!-- ==================== FAGGREINASÍÐA ==================== -->
  <div id="subjectsView" class="max-w-5xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-8">
      <button onclick="showHome()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">
        ← Til baka á forsíðu
      </button>
      <h2 class="text-xl font-extrabold text-slate-900">📚 Faggreinar</h2>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5" id="subjectsGrid"></div>
  </div>

  <!-- ==================== BAKSÍÐA / UPPLÝSINGASÍÐA ==================== -->
  <div id="detailView" class="max-w-4xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-6">
      <button id="backNavBtn" onclick="goBackFromDetail()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">
        ← Til baka
      </button>
      <button onclick="showHome()" class="text-xs text-sky-800 font-semibold hover:underline">
        Forsíða
      </button>
    </div>

    <div class="flex items-center gap-4 mb-8">
      <span id="detailIcon" class="text-5xl md:text-6xl"></span>
      <div>
        <h1 id="detailTitle" class="text-2xl md:text-4xl font-extrabold text-slate-900"></h1>
        <p class="text-xs md:text-sm text-sky-800 font-semibold uppercase tracking-wider pt-1">Vallaskóli &bull; Skólanámskrá</p>
      </div>
    </div>

    <div id="detailContent" class="space-y-6"></div>

    <div class="pt-10 border-t border-slate-200/80 mt-12 flex justify-between items-center">
      <button onclick="goBackFromDetail()" class="px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold transition shadow-md">
        ← Til baka
      </button>
      <a href="#" class="text-xs text-slate-500 hover:text-slate-800 font-medium">Efst á síðu ↑</a>
    </div>
  </div>

  <!-- ==================== POPUP GLUGGI FYRIR KENNARA ==================== -->
  <div id="teacherModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50" onclick="closeTeacherModalOnBg(event)">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center relative shadow-2xl border border-slate-100 space-y-4">
      <button onclick="closeTeacherModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 font-bold text-lg p-1 transition">✕</button>
      
      <img id="teacherModalImg" src="" alt="Mynd af starfsmanni" class="w-32 h-32 rounded-full object-cover mx-auto border-4 border-sky-100 shadow-md">
      
      <div class="space-y-1">
        <h3 id="teacherModalName" class="text-lg font-bold text-slate-900"></h3>
        <p id="teacherModalRole" class="text-xs text-slate-500 font-medium"></p>
      </div>

      <div class="pt-2">
        <a id="teacherModalEmail" href="" class="inline-flex items-center gap-2 px-4 py-2.5 bg-sky-50 hover:bg-sky-100 text-sky-800 rounded-xl text-xs font-semibold transition border border-sky-200/50">
          ✉️ <span id="teacherModalEmailText"></span>
        </a>
      </div>

      <button onclick="closeTeacherModal()" class="w-full pt-2 text-xs text-slate-400 hover:text-slate-600 underline">
        Loka glugga
      </button>
    </div>
  </div>

  <script>

      { id: 'y1', title: '1. árgangur', icon: '🌱' },
      { id: 'y2', title: '2. árgangur', icon: '🍃' },
      { id: 'y3', title: '3. árgangur', icon: '🌿' },

      { id: 'y5', title: '5. árgangur', icon: '🍀' },
      { id: 'y6', title: '6. árgangur', icon: '🌲' },
      { id: 'y7', title: '7. árgangur', icon: '🌳' },
      { id: 'y8', title: '8. árgangur', icon: '🎓' },
      { id: 'y9', title: '9. árgangur', icon: '🎓' },
      { id: 'y10', title: '10. árgangur', icon: '🎓' },
      { id: 'isat', title: 'ÍSAT', icon: '🌍' },
      { id: 'stod', title: 'Stoðkennsla', icon: '🤝' }

      { id: 's_isl', title: 'Íslenska', icon: '📖' },
      { id: 's_stf', title: 'Stærðfræði', icon: '📐' },
      { id: 's_nat', title: 'Náttúrufræði', icon: '🔬' },
      { id: 's_ens', title: 'Enska', icon: '🇬🇧' },

      { id: 'stod', title: 'Stoðkennsla', icon: '🤝' }

    // HJÁLPARFALL TIL AÐ BÚA TIL KENNARAHNAPPA
    function createTeacherCard(name, role, email, imgName) {
      return `
        <button onclick="openTeacherModal('${name}', '${role}', '${email}', 'images/${imgName}')" class="flex items-center gap-3 p-3 bg-slate-50 hover:bg-sky-50/70 hover:border-sky-300 rounded-2xl border border-slate-100 transition duration-200 text-left group shadow-sm w-full">
          <img src="images/${imgName}" alt="${name}" class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm group-hover:scale-105 transition flex-shrink-0" onerror="this.src='https://via.placeholder.com/150?text=${encodeURIComponent(name.split(' ')[0])}';">
          <div class="overflow-hidden">
            <h5 class="font-bold text-xs md:text-sm text-slate-900 group-hover:text-sky-700 transition truncate">${name}</h5>
            <p class="text-xs text-slate-500 truncate">${role}</p>
          </div>
        </button>
      `;
    }

            ${createTeacherCard('Eyberg Sólveigar Högnason', 'Meikarasmiðja', 'eyberg@vallaskoli.is', 'eyberg.jpg')}
            ${createTeacherCard('Halldóra Helga Valdimarsdóttir', 'Textílmennt', 'halldora@vallaskoli.is', 'halldora.jpg')}
            ${createTeacherCard('Daniela Nicole Welling', 'Tónlist', 'daniela@vallaskoli.is', 'daniela.jpg')}
            ${createTeacherCard('Þórey Ólafsdóttir', 'Heimilisfræði', 'thorey@vallaskoli.is', 'thorey.jpg')}
            ${createTeacherCard('Bylgja Lind Pétursdóttir', 'Myndmennt', 'bylgja@vallaskoli.is', 'bylgja.jpg')}
            ${createTeacherCard('Guðný Guðjónsdóttir', 'Hönnun og smíði', 'gudny@vallaskoli.is', 'gudny.jpg')}
          </div>
        </div>
        <div>
          <h5 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">🗣️ Tungumálateymi</h5>

    // HJÁLPARFALL FYRIR HINN FIMMTIPTA RAMMA FYRIR STARFSFÓLK
    function renderStaffSection(umsjonHtml, stodHtml, studningHtml, adrirHtml, stjornendurHtml) {
      return `
        <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-6">
          <div class="flex items-center justify-between border-b pb-2">

            <span class="text-xs text-slate-400 italic">Smelltu á starfsmann til að opna sprettiglugga</span>
          </div>

          <!-- 1. UMSJÓNARKENNARAR -->
          <div class="space-y-3">
            <h4 class="font-semibold text-xs text-sky-800 uppercase tracking-wider">👩‍🏫 Umsjónarkennarar</h4>
            ${umsjonHtml}
          </div>

          <!-- 2. STOÐÞJÓNUSTA -->
          <div class="space-y-3 pt-4 border-t border-slate-100">
            <h4 class="font-semibold text-xs text-sky-800 uppercase tracking-wider">🤝 Stoðþjónusta</h4>
            ${stodHtml}
          </div>

          <!-- 3. STUÐNINGSFULLTRÚAR -->
          <div class="space-y-3 pt-4 border-t border-slate-100">
            <h4 class="font-semibold text-xs text-sky-800 uppercase tracking-wider">🌱 Stuðningsfulltrúar</h4>
            ${studningHtml}
          </div>

          <!-- 4. AÐRIR KENNARAR -->

            <h4 class="font-semibold text-xs text-sky-800 uppercase tracking-wider">🎨 Aðrir kennarar & Fagteymi</h4>

    const CONTENT_DATA = {
      'almennt': {
        title: 'Almennur hluti skólanámskrár',
        icon: '🏫',
        content: `
          <div class="space-y-6">
            <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
              <h3 class="font-bold text-sky-900 text-xl border-b pb-2">🏫 Almennur hluti Vallaskóla</h3>
              <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
                Velkomin í almenna hluta skólanámskrár Vallaskóla. Einkunnarorð skólans eru <strong>Virðing, Þekking og Lífsgleði</strong>.
              </p>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">

                  <h4 class="font-bold text-sky-900 text-sm mb-1">🤝 Virðing</h4>
                  <p class="text-xs text-slate-600">Samskipti einkennast af gagnkvæmri virðingu, umburðarlyndi og góðum vinnubrögðum.</p>
                </div>
                <div class="p-4 bg-amber-50 rounded-2xl border border-amber-100">
                  <h4 class="font-bold text-amber-900 text-sm mb-1">💡 Þekking</h4>

    let currentParentView = 'home';

    let detailLevel = 'root';

    function hideAllViews() {
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('yearsView').classList.add('hidden');
      document.getElementById('subjectsView').classList.add('hidden');
      document.getElementById('detailView').classList.add('hidden');

    function showHome() {
      hideAllViews();
      document.getElementById('homeView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showYears() {
      hideAllViews();
      renderYearsGrid();
      document.getElementById('yearsView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showSubjects() {
      hideAllViews();
      renderSubjectsGrid();
      document.getElementById('subjectsView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showDetail(id, parentView) {
      currentParentView = parentView;
      detailLevel = 'year';
      hideAllViews();

      const item = CONTENT_DATA[id];
      const title = item ? item.title : id;
      const icon = item ? item.icon : '📚';
      const content = item ? item.content : `<div class="bg-white p-6 rounded-2xl border border-slate-200/80"><p class="text-xs text-slate-600">Upplýsingar í vinnslu.</p></div>`;

      document.getElementById('detailIcon').innerText = icon;
      document.getElementById('detailTitle').innerText = title;
      document.getElementById('detailContent').innerHTML = content;

      const backBtn = document.getElementById('backNavBtn');
      if (parentView === 'years') backBtn.innerText = '← Til baka í Árganga';
      else if (parentView === 'subjects') backBtn.innerText = '← Til baka í Faggreinar';
      else backBtn.innerText = '← Til baka';

      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function selectSubject(subjectId) {
      currentSubjectId = subjectId;
      detailLevel = 'subject_grid';
      hideAllViews();

      const sub = SUBJECTS_LIST.find(s => s.id === subjectId);
      if (!sub) return;

      document.getElementById('detailIcon').innerText = sub.icon;
      document.getElementById('detailTitle').innerText = sub.title;

      const startGrade = (subjectId === 's_dan') ? 6 : 1;

      let tilesHtml = '';
      for (let i = startGrade; i <= 10; i++) {
        tilesHtml += `
          <button onclick="openSubjectGrade('${sub.id}', ${i})" class="p-6 bg-white border border-slate-200/80 rounded-2xl hover:border-amber-500 hover:shadow-xl hover:-translate-y-1 transition duration-200 text-center group flex flex-col items-center justify-center space-y-3">
            <span class="text-3xl group-hover:scale-110 transition duration-200">📘</span>
            <span class="text-sm font-bold text-slate-800 group-hover:text-amber-700">${i}. árgangur</span>
          </button>
        `;
      }

      document.getElementById('detailContent').innerHTML = `
        <div class="space-y-4">
          <p class="text-xs md:text-sm text-slate-500 font-medium">Veldu árgang til að skoða námskrá í ${sub.title}:</p>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
            ${tilesHtml}
          </div>
        </div>
      `;

      document.getElementById('backNavBtn').innerText = '← Til baka í Faggreinar';
      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function openSubjectGrade(subjectId, gradeNum) {
      detailLevel = 'subject_grade';
      hideAllViews();

      const sub = SUBJECTS_LIST.find(s => s.id === subjectId);
      const subTitle = sub ? sub.title : 'Faggrein';
      const subIcon = sub ? sub.icon : '📚';

      document.getElementById('detailIcon').innerText = subIcon;
      document.getElementById('detailTitle').innerText = `${subTitle} — ${gradeNum}. árgangur`;

      document.getElementById('detailContent').innerHTML = `
        <div class="bg-white p-12 md:p-16 rounded-3xl border border-slate-200/80 text-center space-y-3 shadow-sm my-4">
          <div class="w-20 h-20 bg-amber-50 text-amber-600 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-3">

        </div>
      `;

      document.getElementById('backNavBtn').innerText = `← Til baka í ${subTitle}`;
      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function goBackFromDetail() {
      if (detailLevel === 'subject_grade' && currentSubjectId) {
        selectSubject(currentSubjectId);
      } else if (detailLevel === 'subject_grid') {
        showSubjects();
      } else if (currentParentView === 'years') {
        showYears();
      } else if (currentParentView === 'subjects') {
        showSubjects();
      } else {
        showHome();
      }
    }

    function openTeacherModal(name, role, email, imgSrc) {
      document.getElementById('teacherModalName').innerText = name;
      document.getElementById('teacherModalRole').innerText = role;
      document.getElementById('teacherModalEmailText').innerText = email;
      document.getElementById('teacherModalEmail').href = "mailto:" + email;
      
      const imgElem = document.getElementById('teacherModalImg');
      imgElem.src = imgSrc;
      imgElem.onerror = function() {
        this.src = 'https://via.placeholder.com/150?text=' + encodeURIComponent(name.split(' ')[0]);
      };

      document.getElementById('teacherModal').style.display = 'flex';
    }

    function closeTeacherModal() {
      document.getElementById('teacherModal').style.display = 'none';
    }

    function closeTeacherModalOnBg(e) {
      if (e.target.id === 'teacherModal') {
        closeTeacherModal();
      }
    }

    function renderYearsGrid() {
      const container = document.getElementById('yearsGrid');
      container.innerHTML = YEARS_LIST.map(item => `
        <button onclick="showDetail('${item.id}', 'years')" class="p-6 md:p-7 bg-white border border-slate-200/80 rounded-2xl hover:border-sky-600 hover:shadow-xl hover:-translate-y-1 transition duration-200 text-center group flex flex-col items-center justify-center space-y-3">

          <span class="text-sm font-bold text-slate-800 group-hover:text-sky-700">${item.title}</span>
        </button>

    function renderSubjectsGrid() {
