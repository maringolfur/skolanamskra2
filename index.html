<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skólanámskrá Vallaskóla</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-[#fcfbf9] via-[#fcfbf9] via-70% to-sky-100/80 min-h-screen text-slate-800 font-sans p-4 md:p-8">

  <!-- ==================== FORSÍÐA ==================== -->
  <div id="homeView" class="max-w-4xl mx-auto pt-8 pb-16 space-y-10">
    <header class="text-center space-y-4">
      <div class="flex justify-center mb-2">
        <img src="images/logo.jpg" alt="Vallaskóli Lógó" class="h-32 md:h-40 object-contain" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='inline-flex';">
        <div id="fallbackLogo" class="hidden items-center justify-center w-28 h-28 rounded-2xl bg-sky-700 text-white font-extrabold text-4xl shadow-md">
          V
        </div>
      </div>
      <div class="space-y-2">
        <p class="text-xs md:text-sm font-semibold tracking-wider text-sky-800 uppercase italic">
          Virðing &bull; Þekking &bull; Lífsgleði
        </p>
        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight">
          Skólanámskrá Vallaskóla
        </h1>
        <p class="text-sm md:text-base text-slate-500 max-w-md mx-auto pt-1">
          Veldu flokk til að skoða námskrána, árganga eða faggreinar.
        </p>
      </div>
    </header>

    <main class="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-4xl mx-auto">
      <!-- 1. FLIPPI: ALMENNUR HLUTI -->
      <button onclick="openDetailView('Almennur hluti', '🏫', '<div class=\'bg-white p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-4\'><h3 class=\'font-bold text-sky-900 text-xl border-b pb-2\'>🏫 Um Vallaskóla</h3><p class=\'text-slate-600 text-sm leading-relaxed\'>Vallaskóli er heildstæður grunnskóli á Selfossi þar sem einkunnarorð skólans – <strong>Virðing, Þekking og Lífsgleði</strong> – eru hafðar að leiðarljósi í öllu skólastarfi.</p></div>')" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-emerald-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-emerald-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          🏫
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-emerald-700">Almennur hluti</h2>
          <p class="text-xs text-slate-500 mt-1.5">Stefna skólans, gildi og almennt um skólastarfið</p>
        </div>
      </button>

      <!-- 2. FLIPPI: ÁRGANGAR -->
      <button onclick="showYears()" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-sky-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-sky-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          🎓
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-sky-700">Árgangar</h2>
          <p class="text-xs text-slate-500 mt-1.5">1. – 10. bekkur, Stoðþjónusta og ÍSAT</p>
        </div>
      </button>

      <!-- 3. FLIPPI: FAGGREINAR -->
      <button onclick="showSubjects()" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-amber-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-amber-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          📚
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-amber-700">Faggreinar</h2>
          <p class="text-xs text-slate-500 mt-1.5">Námsgreinar, undirgreinar og valgreinar</p>
        </div>
      </button>
    </main>
  </div>

  <!-- ==================== ÁRGANGASÍÐA ==================== -->
  <div id="yearsView" class="max-w-5xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-8">
      <button onclick="showHome()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">
        ← Til baka á forsíðu
      </button>
      <h2 class="text-xl font-extrabold text-slate-900">🎓 Árgangar & Stoðþjónusta</h2>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5" id="yearsGrid"></div>
  </div>

  <!-- ==================== FAGGREINASÍÐA ==================== -->
  <div id="subjectsView" class="max-w-5xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-8">
      <button onclick="showHome()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">
        ← Til baka á forsíðu
      </button>
      <h2 class="text-xl font-extrabold text-slate-900">📚 Faggreinar</h2>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5" id="subjectsGrid"></div>
  </div>

  <!-- ==================== UPPLÝSINGASÍÐA ==================== -->
  <div id="detailView" class="max-w-4xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-6">
      <button id="backNavBtn" onclick="goBackFromDetail()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">
        ← Til baka
      </button>
      <button onclick="showHome()" class="text-xs text-sky-800 font-semibold hover:underline">Forsíða</button>
    </div>

    <div class="flex items-center gap-4 mb-8">
      <span id="detailIcon" class="text-5xl md:text-6xl"></span>
      <div>
        <h1 id="detailTitle" class="text-2xl md:text-4xl font-extrabold text-slate-900"></h1>
        <p class="text-xs md:text-sm text-sky-800 font-semibold uppercase tracking-wider pt-1">Vallaskóli &bull; Skólanámskrá</p>
      </div>
    </div>

    <div id="detailContent" class="space-y-6"></div>

    <div class="pt-10 border-t border-slate-200/80 mt-12 flex justify-between items-center">
      <button onclick="goBackFromDetail()" class="px-6 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold transition shadow-md">
        ← Til baka
      </button>
      <a href="#" class="text-xs text-slate-500 hover:text-slate-800 font-medium">Efst á síðu ↑</a>
    </div>
  </div>

  <!-- ==================== POPUP FYRIR STARFSMANN ==================== -->
  <div id="teacherModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50" onclick="closeTeacherModalOnBg(event)">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center relative shadow-2xl border border-slate-100 space-y-4">
      <button onclick="closeTeacherModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700 font-bold text-lg p-1 transition">✕</button>
      <img id="teacherModalImg" src="" alt="Starfsmaður" class="w-32 h-32 rounded-full object-cover mx-auto border-4 border-sky-100 shadow-md">
      <div class="space-y-1">
        <h3 id="teacherModalName" class="text-lg font-bold text-slate-900"></h3>
        <p id="teacherModalRole" class="text-xs text-slate-500 font-medium"></p>
      </div>
      <div class="pt-2">
        <a id="teacherModalEmail" href="" class="inline-flex items-center gap-2 px-4 py-2.5 bg-sky-50 hover:bg-sky-100 text-sky-800 rounded-xl text-xs font-semibold transition border border-sky-200/50">
          ✉️ <span id="teacherModalEmailText"></span>
        </a>
      </div>
    </div>
  </div>

  <!-- ==================== TENGING SKRÁA (ALLIR 10 ÁRGANGAR) ==================== -->
  <!-- 1. Starfsmannalisti úr Google Sheets / CSV -->
  <script src="staff.js?v=2"></script>

  <!-- 2. Trjástrúktúr fyrir Faggreinar og Árganga -->
  <script src="subjects.js?v=2"></script>

  <!-- 3. Árgangaskrár (1. – 10. bekkur) -->
  <script src="y1.js?v=2"></script>
  <script src="y2.js?v=2"></script>
  <script src="y3.js?v=2"></script>
  <script src="y4.js?v=2"></script>
  <script src="y5.js?v=2"></script>
  <script src="y6.js?v=2"></script>
  <script src="y7.js?v=2"></script>
  <script src="y8.js?v=2"></script>
  <script src="y9.js?v=2"></script>
  <script src="y10.js?v=2"></script>
<script src="stod.js?v=2"></script>
  <script src="isat.js?v=2"></script>
  <script src="subjects.js"></script>
<script src="islenska.js"></script>
  <script src="staerdfraedi.js"></script>
  <script src="natturufraedi.js"></script>
  <script src="samfelagsfraedi.js"></script>
  <script src="enska.js"></script>
  <script src="danska.js"></script>
  <script src="skolaithrottir.js"></script>
  <script src="logv.js"></script>
  <script src="ahugasvidsval.js"></script>
  <!-- 4. Aðalstýrikóði viðmótsins -->
  <script src="main.js?v=2"></script>
</body>
</html>
