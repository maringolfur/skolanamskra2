    // ----------------------------------------------------
    // NAVIGATION & VIEW SWITCHING LOGIC
    // ----------------------------------------------------
    let currentParentView = 'home';

    function hideAllViews() {
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('yearsView').classList.add('hidden');
      document.getElementById('subjectsView').classList.add('hidden');
      document.getElementById('detailView').classList.add('hidden');
    }

    function showHome() {
      hideAllViews();
      document.getElementById('homeView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showYears() {
      hideAllViews();
      renderYearsGrid();
      document.getElementById('yearsView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showSubjects() {
      hideAllViews();
      renderSubjectsGrid();
      document.getElementById('subjectsView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showDetail(id, parentView) {
      currentParentView = parentView;
      hideAllViews();

      const item = CONTENT_DATA[id];
      const fallbackTitle = id;
      
      const title = item ? item.title : fallbackTitle;
      const icon = item ? item.icon : '📚';
      const content = item ? item.content : `
        <div class="bg-white p-6 rounded-2xl border border-slate-200/80">
          <p class="text-xs text-slate-600">Nánari upplýsingar fyrir þennan hluta eru í vinnslu.</p>
        </div>
      `;

      document.getElementById('detailIcon').innerText = icon;
      document.getElementById('detailTitle').innerText = title;
      document.getElementById('detailContent').innerHTML = content;

      const backBtn = document.getElementById('backNavBtn');
      if (parentView === 'years') {
        backBtn.innerText = '← Til baka í Árganga';
      } else if (parentView === 'subjects') {
        backBtn.innerText = '← Til baka í Faggreinar';
      } else {
        backBtn.innerText = '← Til baka';
      }

      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function goBackFromDetail() {
      if (currentParentView === 'years') {
        showYears();
      } else if (currentParentView === 'subjects') {
        showSubjects();
      } else {
        showHome();
      }
    }

    // ----------------------------------------------------
    // RENDER GRID TILES
    // ----------------------------------------------------
    function renderYearsGrid() {
      const container = document.getElementById('yearsGrid');
      container.innerHTML = YEARS_LIST.map(item => `
        <button onclick="showDetail('${item.id}', 'years')" class="p-5 bg-white border border-slate-200/80 rounded-2xl hover:border-sky-600 hover:shadow-md hover:-translate-y-0.5 transition text-center group flex flex-col items-center justify-center space-y-2">
          <span class="text-3xl group-hover:scale-110 transition duration-200">${item.icon}</span>
          <span class="text-xs font-bold text-slate-800 group-hover:text-sky-700">${item.title}</span>
        </button>
      `).join('');
    }

    function renderSubjectsGrid() {
      const container = document.getElementById('subjectsGrid');
      container.innerHTML = SUBJECTS_LIST.map(item => `
        <button onclick="showDetail('${item.id}', 'subjects')" class="p-5 bg-white border border-slate-200/80 rounded-2xl hover:border-amber-600 hover:shadow-md hover:-translate-y-0.5 transition text-center group flex flex-col items-center justify-center space-y-2">
          <span class="text-3xl group-hover:scale-110 transition duration-200">${item.icon}</span>
          <span class="text-xs font-bold text-slate-800 group-hover:text-amber-700">${item.title}</span>
        </button>
      `).join('');
    }
  </script>
