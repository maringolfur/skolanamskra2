<!DOCTYPE html>
<html lang="is">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skólanámskrá Vallaskóla</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-[#fcfbf9] via-[#fcfbf9] via-70% to-sky-100/80 min-h-screen text-slate-800 font-sans p-4 md:p-8">

  <!-- ==================== FORSÍÐA (YFIRFLOKKAR) ==================== -->

        <div id="fallbackLogo" class="hidden items-center justify-center w-28 h-28 rounded-2xl bg-sky-700 text-white font-extrabold text-4xl shadow-md">
          V
        </div>
      </div>
      <div class="space-y-2">
        <p class="text-xs md:text-sm font-semibold tracking-wider text-sky-800 uppercase italic">
          Virðing &bull; Þekking &bull; Lífsgleði
        </p>
        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight">
          Skólanámskrá Vallaskóla
        </h1>
        <p class="text-sm md:text-base text-slate-500 max-w-md mx-auto pt-1">
          Veldu flokk til að skoða námskrána, árganga eða faggreinar.
        </p>
      </div>
    </header>

    <main class="grid grid-cols-1 sm:grid-cols-3 gap-6 max-w-4xl mx-auto">
      <!-- FLÍS 1: ALMENNUR HLUTI -->
      <button onclick="showDetail('almennt', 'home')" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-emerald-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-emerald-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          🏫
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900 group-hover:text-emerald-700">Almennur hluti</h2>
          <p class="text-xs text-slate-500 mt-1.5">Stefna skólans, gildi og almennt um skólastarfið</p>
        </div>
      </button>

      <!-- FLÍS 2: ÁRGANGAR -->
      <button onclick="showYears()" class="p-8 md:p-10 bg-white border border-slate-200/80 rounded-3xl hover:border-sky-600 hover:shadow-2xl hover:-translate-y-1.5 transition duration-300 text-center group flex flex-col items-center justify-center space-y-4">
        <div class="w-20 h-20 rounded-3xl bg-sky-50 flex items-center justify-center text-4xl group-hover:scale-110 transition duration-300">
          🎓
        </div>
        <div>

        </div>

          📚
        </div>

        </div>

    </main>

  <!-- ==================== ÁRGANGASÍÐA ==================== -->
  <div id="yearsView" class="max-w-5xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-8">
      <button onclick="showHome()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">
        ← Til baka á forsíðu
      </button>
      <h2 class="text-xl font-extrabold text-slate-900">🎓 Árgangar</h2>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5" id="yearsGrid"></div>
  </div>

  <!-- ==================== FAGGREINASÍÐA ==================== -->

    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-8">

        ← Til baka á forsíðu
      </button>
      <h2 class="text-xl font-extrabold text-slate-900">📚 Faggreinar</h2>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5" id="subjectsGrid"></div>
  </div>

  <!-- ==================== BAKSÍÐA / UPPLÝSINGASÍÐA ==================== -->
  <div id="detailView" class="max-w-4xl mx-auto hidden pt-6 pb-16">
    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-6">
      <button id="backNavBtn" onclick="goBackFromDetail()" class="inline-flex items-center gap-2 px-4 py-2 bg-white hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-bold transition shadow-sm border border-slate-200/60">

      </button>

      </button>

    <div class="flex items-center gap-4 mb-8">

    <div class="pt-10 border-t border-slate-200/80 mt-12 flex justify-between items-center">

      </button>

        <h3 id="teacherModalName" class="text-lg font-bold text-slate-900"></h3>
        <p id="teacherModalRole" class="text-xs text-slate-500 font-medium"></p>
      </div>

    let currentParentView = 'home';
    let currentSubjectId = null;
    let detailLevel = 'root';

    function hideAllViews() {
      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('yearsView').classList.add('hidden');
      document.getElementById('subjectsView').classList.add('hidden');
      document.getElementById('detailView').classList.add('hidden');
    }

    function showHome() {
      hideAllViews();
      document.getElementById('homeView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showYears() {
      hideAllViews();
      renderYearsGrid();
      document.getElementById('yearsView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showSubjects() {
      hideAllViews();
      renderSubjectsGrid();
      document.getElementById('subjectsView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function showDetail(id, parentView) {
      currentParentView = parentView;
      detailLevel = 'year';
      hideAllViews();

      const item = CONTENT_DATA[id];
      const title = item ? item.title : id;
      const icon = item ? item.icon : '📚';
      const content = item ? item.content : `<div class="bg-white p-6 rounded-2xl border border-slate-200/80"><p class="text-xs text-slate-600">Upplýsingar í vinnslu.</p></div>`;

      document.getElementById('detailIcon').innerText = icon;
      document.getElementById('detailTitle').innerText = title;
      document.getElementById('detailContent').innerHTML = content;

      const backBtn = document.getElementById('backNavBtn');
      if (parentView === 'years') backBtn.innerText = '← Til baka í Árganga';
      else if (parentView === 'subjects') backBtn.innerText = '← Til baka í Faggreinar';
      else backBtn.innerText = '← Til baka';

      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function selectSubject(subjectId) {
      currentSubjectId = subjectId;
      detailLevel = 'subject_grid';
      hideAllViews();

      const sub = SUBJECTS_LIST.find(s => s.id === subjectId);
      if (!sub) return;

      document.getElementById('detailIcon').innerText = sub.icon;
      document.getElementById('detailTitle').innerText = sub.title;

      const startGrade = (subjectId === 's_dan') ? 6 : 1;

      let tilesHtml = '';
      for (let i = startGrade; i <= 10; i++) {
        tilesHtml += `
          <button onclick="openSubjectGrade('${sub.id}', ${i})" class="p-6 bg-white border border-slate-200/80 rounded-2xl hover:border-amber-500 hover:shadow-xl hover:-translate-y-1 transition duration-200 text-center group flex flex-col items-center justify-center space-y-3">
            <span class="text-3xl group-hover:scale-110 transition duration-200">📘</span>
            <span class="text-sm font-bold text-slate-800 group-hover:text-amber-700">${i}. árgangur</span>
          </button>
        `;
      }

      const introHtml = SUBJECT_INTROS[subjectId] || '';

      document.getElementById('detailContent').innerHTML = `
        <div class="space-y-4">
          ${introHtml}
          <p class="text-xs md:text-sm text-slate-500 font-medium">Veldu árgang til að skoða námskrá í ${sub.title}:</p>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
            ${tilesHtml}
          </div>
        </div>
      `;

      document.getElementById('backNavBtn').innerText = '← Til baka í Faggreinar';
      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function openSubjectGrade(subjectId, gradeNum) {
      detailLevel = 'subject_grade';
      hideAllViews();

      const sub = SUBJECTS_LIST.find(s => s.id === subjectId);
      const subTitle = sub ? sub.title : 'Faggrein';
      const subIcon = sub ? sub.icon : '📚';

      document.getElementById('detailIcon').innerText = subIcon;
      document.getElementById('detailTitle').innerText = `${subTitle} — ${gradeNum}. árgangur`;

      if (subjectId === 's_stf' && MATH_GRADE_DATA[gradeNum]) {
        const mathData = MATH_GRADE_DATA[gradeNum];
        const skillsList = Array.isArray(mathData.skills) 
          ? mathData.skills.map(s => `<li>${s}</li>`).join('')
          : `<li>${mathData.skills}</li>`;

        document.getElementById('detailContent').innerHTML = `
          <div class="space-y-6">
            <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
              <h3 class="font-bold text-sky-900 text-lg border-b pb-2">🏫 Kennsluskipulag & Markmið</h3>
              <p class="text-xs md:text-sm text-slate-600 leading-relaxed italic bg-slate-50 p-4 rounded-2xl border border-slate-100">
                ${mathData.setup}
              </p>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
              <h3 class="font-bold text-sky-900 text-lg border-b pb-2">🎯 Námsþættir & Hæfniviðmið</h3>
              <ul class="list-disc pl-5 text-xs md:text-sm space-y-2 text-slate-600">
                ${skillsList}
              </ul>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
              <h3 class="font-bold text-sky-900 text-lg border-b pb-2">📚 Námsefni</h3>
              <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
                ${mathData.materials}
              </p>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
              <h3 class="font-bold text-sky-900 text-lg border-b pb-2">📊 Námsmat</h3>
              <p class="text-xs md:text-sm text-slate-600 leading-relaxed">
                ${mathData.assessment}
              </p>
            </div>
          </div>
        `;
      } else {
        document.getElementById('detailContent').innerHTML = `
          <div class="bg-white p-12 md:p-16 rounded-3xl border border-slate-200/80 text-center space-y-3 shadow-sm my-4">
            <div class="w-20 h-20 bg-amber-50 text-amber-600 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-3">
              🛠️
            </div>
            <h3 class="font-bold text-slate-900 text-xl">Í vinnslu</h3>
            <p class="text-xs md:text-sm text-slate-500 max-w-sm mx-auto">Verið er að vinna í að setja inn skólanámskrá fyrir ${gradeNum}. árgang í ${subTitle}.</p>
          </div>
        `;
      }

      document.getElementById('backNavBtn').innerText = `← Til baka í ${subTitle}`;
      document.getElementById('detailView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function goBackFromDetail() {
      if (detailLevel === 'subject_grade' && currentSubjectId) {
        selectSubject(currentSubjectId);
      } else if (detailLevel === 'subject_grid') {
        showSubjects();
      } else if (currentParentView === 'years') {
        showYears();
      } else if (currentParentView === 'subjects') {
        showSubjects();
      } else {
        showHome();
      }
    }

    function openTeacherModal(name, role, email, imgSrc) {
      document.getElementById('teacherModalName').innerText = name;
      document.getElementById('teacherModalRole').innerText = role;
      document.getElementById('teacherModalEmailText').innerText = email;
      document.getElementById('teacherModalEmail').href = "mailto:" + email;
      
      const imgElem = document.getElementById('teacherModalImg');
      imgElem.src = imgSrc;
      imgElem.onerror = function() {
        this.src = 'https://via.placeholder.com/150?text=' + encodeURIComponent(name.split(' ')[0]);
      };

      document.getElementById('teacherModal').style.display = 'flex';
    }

    function closeTeacherModal() {
      document.getElementById('teacherModal').style.display = 'none';
    }

    function closeTeacherModalOnBg(e) {
      if (e.target.id === 'teacherModal') {
        closeTeacherModal();
      }
    }

    function renderYearsGrid() {
      const container = document.getElementById('yearsGrid');
      container.innerHTML = YEARS_LIST.map(item => `
        <button onclick="showDetail('${item.id}', 'years')" class="p-6 md:p-7 bg-white border border-slate-200/80 rounded-2xl hover:border-sky-600 hover:shadow-xl hover:-translate-y-1 transition duration-200 text-center group flex flex-col items-center justify-center space-y-3">
          <span class="text-4xl group-hover:scale-110 transition duration-200">${item.icon}</span>
          <span class="text-sm font-bold text-slate-800 group-hover:text-sky-700">${item.title}</span>
        </button>
      `).join('');
    }

    function renderSubjectsGrid() {
      const container = document.getElementById('subjectsGrid');
      container.innerHTML = SUBJECTS_LIST.map(item => `
        <button onclick="selectSubject('${item.id}')" class="p-6 md:p-7 bg-white border border-slate-200/80 rounded-2xl hover:border-amber-600 hover:shadow-xl hover:-translate-y-1 transition duration-200 text-center group flex flex-col items-center justify-center space-y-3">
          <span class="text-4xl group-hover:scale-110 transition duration-200">${item.icon}</span>
          <span class="text-sm font-bold text-slate-800 group-hover:text-amber-700">${item.title}</span>
        </button>
      `).join('');
    }
  </script>
